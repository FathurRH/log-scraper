# A small sample system on four "servers" plus Log Scraper.
#   docker compose up -d --build      then open http://localhost:8090
#   docker compose stop app-04         to see how Log Scraper reports a server that is down
x-sample: &sample
  build: ./sample-app
  image: log-scraper/sample-app:1.0
  environment: &sampleenv
    SSH_USER: logreader
    SSH_PASSWORD: ${SSH_PASSWORD:-bacasaja}
    PROCESS_URL: http://app-02:8080
    DATA_URL: http://app-03:8080
    NOTIF_URL: http://app-04:8080
  restart: unless-stopped

services:
  app-01:
    <<: *sample
    hostname: app-01
    environment: { <<: *sampleenv, ROLE: gateway }
    ports: ["2201:2222"]
  app-02:
    <<: *sample
    hostname: app-02
    environment: { <<: *sampleenv, ROLE: process }
    ports: ["2202:2222"]
  app-03:
    <<: *sample
    hostname: app-03
    environment: { <<: *sampleenv, ROLE: data }
    ports: ["2203:2222"]
  app-04:
    <<: *sample
    hostname: app-04
    environment: { <<: *sampleenv, ROLE: notif }
    ports: ["2204:2222"]

  log-scraper:
    build: ./log-scraper
    image: log-scraper/log-scraper:1.0
    ports: ["8090:8090"]
    environment:
      APP01_HOST: app-01
      APP01_PORT: 2222
      APP02_HOST: app-02
      APP02_PORT: 2222
      APP03_HOST: app-03
      APP03_PORT: 2222
      APP04_HOST: app-04
      APP04_PORT: 2222
      SSH_PASSWORD: ${SSH_PASSWORD:-bacasaja}
      AUDIT_FILE: /data/audit.log
      SERVERS_FILE: /data/servers.json
      KEY_DIR: /data/keys
      MASKING_FILE: /data/masking.json
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes: ["log-scraper-data:/data"]
    depends_on: [app-01, app-02, app-03, app-04]
    restart: unless-stopped

volumes:
  log-scraper-data:
